<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Balance Display -->
        <div class="balance-card">
            <h2>Total Expenses</h2>
            <p class="balance-amount" id="totalBalance">$0.00</p>
        </div>

        <!-- Input Form -->
        <div class="form-card">
            <h3>Add New Transaction</h3>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input 
                        type="text" 
                        id="itemName" 
                        placeholder="e.g., Grocery Shopping" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input 
                        type="number" 
                        id="amount" 
                        placeholder="0.00" 
                        step="0.01" 
                        min="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <div class="category-input-wrapper">
                        <select id="category" required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Fun">Fun</option>
                        </select>
                        <button 
                            type="button" 
                            id="addCategoryBtn" 
                            class="add-category-btn"
                            title="Add custom category"
                        >
                            +
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Add Transaction</button>
            </form>
        </div>

        <!-- Sorting Controls -->
        <div class="controls-card">
            <label for="sortBy">Sort By:</label>
            <select id="sortBy">
                <option value="date">Date Added (Default)</option>
                <option value="amount-desc">Amount (High to Low)</option>
                <option value="amount-asc">Amount (Low to High)</option>
                <option value="category">Category (A-Z)</option>
            </select>
        </div>

        <!-- Chart Section -->
        <div class="chart-card">
            <h3>Spending Distribution</h3>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
            <p class="chart-message" id="chartMessage">Add transactions to see the chart</p>
        </div>

        <!-- Transaction List -->
        <div class="transactions-card">
            <h3>Transaction History</h3>
            <div id="transactionList" class="transaction-list">
                <p class="empty-message">No transactions yet. Start by adding one above!</p>
            </div>
        </div>
    </div>

    <!-- Custom Category Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h3>Add Custom Category</h3>
            <input 
                type="text" 
                id="customCategoryInput" 
                placeholder="Enter category name"
                maxlength="20"
            >
            <div class="modal-actions">
                <button id="cancelCategoryBtn" class="btn btn-secondary">Cancel</button>
                <button id="saveCategoryBtn" class="btn btn-primary">Add</button>
            </div>
        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
